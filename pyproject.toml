[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-region-picker"
version = "0.2.2"
description = "Rank cloud regions by grid carbon intensity under a latency constraint"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/carbon-region-picker"
Issues = "https://github.com/fabiocicerchia/carbon-region-picker/issues"
Changelog = "https://github.com/fabiocicerchia/carbon-region-picker/blob/main/CHANGELOG.md"

[project.scripts]
carbon-region-picker = "carbon_region_picker:main"

[tool.setuptools]
py-modules = ["carbon_region_picker"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
