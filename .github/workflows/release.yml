name: release

# Releases are driven by release-please. It reads Conventional Commit messages
# on main and keeps an open "release PR" with the next version bump (in
# pyproject.toml) + CHANGELOG. Merging that PR tags the release (vX.Y.Z),
# creates the GitHub Release, and triggers the build + (opt-in) PyPI publish.
#
# PyPI publishing is opt-in: configure a Trusted Publisher for this repository
# on pypi.org (workflow: release.yml, environment: pypi) and set the repository
# variable PUBLISH_TO_PYPI to "true".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # Bumps `version` in pyproject.toml and maintains CHANGELOG.md.
          release-type: python

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach build artifacts to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Attach artifacts to the release
        # yamllint disable-line rule:line-length
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
